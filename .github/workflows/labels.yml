name: Sync labels

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/labels.json]

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            name=$(jq -r .name <<<"$l"); color=$(jq -r .color <<<"$l"); desc=$(jq -r .description <<<"$l")
            gh label create "$name" --color "$color" --description "$desc" --force --repo "$GITHUB_REPOSITORY"
          done
