name: Claude agent

# Two ways to start the agent:
#  1. Add the label `agent:claude` to an issue  -> it implements the issue and opens a PR.
#  2. Write `@claude <request>` in an issue/PR comment or review -> it answers or makes the change.
# Requires repo secret ANTHROPIC_API_KEY and the Claude GitHub App (run `/install-github-app` in Claude Code).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Mark issue in progress
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" \
            --add-label "status:in-progress" --remove-label "status:backlog" --remove-label "status:ready" || true

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "agent:claude"
          prompt: ${{ github.event_name == 'issues' && format('Implement issue #{0} in this repo. Follow AGENTS.md exactly: branch agent/{0}-<slug>, meet every acceptance criterion, run typecheck, lint and tests, then open a PR with "Closes #{0}" using the PR template. If the spec is unclear, comment your questions on the issue, add label status:blocked, and stop.', github.event.issue.number) || '' }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm ci),Bash(npm run *),Bash(npm test*),Bash(npx tsc*),Bash(npx eslint*),Bash(npx vitest*),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
